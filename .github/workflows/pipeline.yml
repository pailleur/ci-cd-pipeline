name: CI/CD Pipeline

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - main

jobs:
  # -------------------------------------------------------------
  # JOB 1: Test & Build (Runs ONLY on PR to dev)
  # -------------------------------------------------------------
  build-and-test:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' 

      - name: Install Dependencies
        run: |
          cd frontend && npm install
          cd ../backend && npm install

      - name: Run Linting
        run: |
          cd frontend && npm run lint
          cd ../backend && npm run lint

      - name: Run NPM Audit
        run: |
          cd frontend && npm audit --audit-level=moderate || true
          cd ../backend && npm audit --audit-level=moderate || true

      - name: Run Snyk Security Check
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true 

      - name: Execute Tests
        run: |
          cd frontend && npm test
          cd ../backend && npm test

      - name: Build Docker Images (Dry Run)
        run: docker compose -f docker-compose.yml build

  # -------------------------------------------------------------
  # JOB 2: Deploy to Docker Hub (Runs ONLY on merge to main)
  # -------------------------------------------------------------
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create .env files from GitHub Secrets
        run: |
          echo "API_KEY=${{ secrets.API_KEY }}" > backend/.env
          echo "DB_URL=${{ secrets.DB_URL }}" >> backend/.env
          # Add any other required secrets here

      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ci-cd-testing-deploy:backend

      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ci-cd-testing-deploy:frontend